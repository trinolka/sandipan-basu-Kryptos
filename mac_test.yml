name: macOS Automation Compiler Harness

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: macos-latest # FIXED: Removed the duplicate 'runs-' syntax error
    steps:
      - name: Fetch Local Repository Snapshot
        uses: actions/checkout@v4

      - name: Mount and Link OpenSSL 3 SDK
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: 🛠️ Build Asymmetric Compiler Module (kcc_mac)
        run: |
          # FIXED: Pointed directly to kcc_mac.c which is already present in your repo
          gcc -O3 -I${{ env.OPENSSL_ROOT }}/include kcc_mac.c -o kcc_mac -L${{ env.OPENSSL_ROOT }}/lib -lssl -lcrypto

      - name: 🛠️ Build Decryption Stream Module (klink_mac)
        run: |
          # FIXED: Pointed directly to klink_mac.c containing the macOS shm_open fixes
          gcc -O3 -I${{ env.OPENSSL_ROOT }}/include klink_mac.c -o klink_mac -L${{ env.OPENSSL_ROOT }}/lib -lssl -lcrypto

      - name: 🧪 Execute Compilation Pass (kcc_mac public.pem manifest.txt)
        run: |
          # Dynamically generate safe verification keys inside the workspace if they are missing
          [ ! -f private.pem ] && openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048 2>/dev/null
          [ ! -f public.pem ] && openssl rsa -pubout -in private.pem -out public.pem 2>/dev/null
          ./kcc_mac public.pem manifest.txt

      - name: 🧪 Run Decryption Execution (klink_mac private.pem app.kryptos)
        run: |
          # 1. Force pull the process monitoring library into the standard python runtime site space
          python3 -m pip install --break-system-packages psutil
          
          # 2. Extract the exact site-packages path from the running system interpreter
          PYTHON_SITE_PATH=$(python3 -c "import site; print(site.getsitepackages()[0])")
          echo "Discovered system library path: $PYTHON_SITE_PATH"
          
          # 3. Securely bridge the isolated workspace environment via the PYTHONPATH variable
          # This forces the KryptosMemoryLoader to bridge the psutil module framework into memory safely
          export PYTHONPATH="$PYTHON_SITE_PATH:$PYTHONPATH"
          
          # 4. Pass an enter character via string piping to step over the interactive pause anchor safely
          echo "" | ./klink_mac private.pem app.kryptos mac/src/main.py



