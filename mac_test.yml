name: macOS Automation Compiler Harness

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-verify:
    runs-on: macos-latest
    steps:
      - name: Fetch Local Repository Snapshot
        uses: actions/checkout@v4

      - name: Mount and Link OpenSSL 3 SDK
        run: |
          brew install openssl@3
          echo "OPENSSL_ROOT=$(brew --prefix openssl@3)" >> $GITHUB_ENV

      - name: 🛠️ Build Asymmetric Compiler Module (kcc_mac)
        run: |
          gcc -O3 -I${{ env.OPENSSL_ROOT }}/include kcc_mac.c -o kcc_mac -L${{ env.OPENSSL_ROOT }}/lib -lssl -lcrypto

      - name: 🛠️ Build Decryption Stream Module (klink_mac)
        run: |
          gcc -O3 -I${{ env.OPENSSL_ROOT }}/include klink_mac.c -o klink_mac -L${{ env.OPENSSL_ROOT }}/lib -lssl -lcrypto

      - name: 🧪 Execute Compilation Pass (kcc_mac)
        run: |
          [ ! -f private.pem ] && openssl genpkey -algorithm RSA -out private.pem -pkeyopt rsa_keygen_bits:2048 2>/dev/null
          [ ! -f public.pem ] && openssl rsa -pubout -in private.pem -out public.pem 2>/dev/null
          ./kcc_mac public.pem manifest.txt

      - name: 📦 Install Python Dependencies Natively
        # Using continue-on-error ensures that even if a package throws an installation warning,
        # it won't force-abort the entire pipeline before the engine executes!
        continue-on-error: true
        run: |
          SYS_PYTHON=$(which python3)
          echo "Targeting system python installation: $SYS_PYTHON"
          $SYS_PYTHON -m pip install --break-system-packages psutil requests SpeechRecognition googletrans==4.0.0-rc1 PyQt6

      - name: 🚀 Run Decryption Execution (klink_mac)
        run: |
          # Step completely past the getchar() leak-pause anchor safely using an EOF string pipe hook
          # Notice we target the files matching your exact encrypted list configuration rules
          echo "" | ./klink_mac private.pem app.kryptos mac/src/x5.py








